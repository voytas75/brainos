name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lock and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.8.23"
      - run: uv lock --check
      - run: uv sync --extra dev --group dev --frozen
      - run: uv run --extra dev --group dev --frozen ruff check .
      - run: uv run --extra dev --group dev --frozen ruff format --check .
      - run: uv run --extra dev --group dev --frozen pyright
      - run: uv run --extra dev --group dev --frozen pytest -q
