[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainos"
version = "0.1.0"
description = "SQLite-first cognitive memory system for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Wojtek / OpenClaw" }
]
dependencies = [
  "litellm>=1.75.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
brainos = "brainos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PIE", "PLW", "BLE", "S110"]

[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    "ruff==0.16.1",
]
